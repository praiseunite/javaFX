<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <filter id="svShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="svArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .head  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #94a3b8; letter-spacing: .06em; }
    .card  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; font-weight: 800; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .d     { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748b; }
    .note  { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
  </style>

  <rect width="900" height="520" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">Stack extends Vector &#8212; the design mistake, drawn</text>
  <text x="30" y="54" class="sub">A stack has two operations that matter. This one inherited dozens, and they all reach in from underneath.</text>

  <!-- left: the stack drawing -->
  <text x="24" y="86" class="head">WHAT YOU PUSH</text>
  <g filter="url(#svShadow)">
    <rect x="24" y="96" width="380" height="238" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <rect x="70" y="120" width="180" height="34" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.8"/>
  <text x="160" y="142" class="m" fill="#047857" text-anchor="middle">"top"</text>
  <rect x="70" y="160" width="180" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="182" class="m" fill="#1d4ed8" text-anchor="middle">"middle"</text>
  <rect x="70" y="200" width="180" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="222" class="m" fill="#1d4ed8" text-anchor="middle">"bottom"</text>

  <text x="262" y="142" class="d">&#8592; peek() and pop() work here</text>
  <text x="262" y="182" class="d">&#8592; the stack hides this</text>
  <text x="262" y="222" class="d">&#8592; so does this</text>

  <rect x="70" y="252" width="180" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="274" class="m" fill="#b91c1c" text-anchor="middle">"sneaked in"</text>
  <path d="M 46 269 L 64 269" stroke="#ef4444" stroke-width="2" marker-end="url(#svArr)"/>
  <text x="262" y="274" class="d" fill="#b91c1c">&#8592; add(0, x) puts it at the BOTTOM</text>

  <text x="46" y="312" class="note">plates.add(0, "sneaked in") is legal, compiles, and is not a stack operation.</text>
  <text x="46" y="328" class="note">Nothing stops it. A Stack is a Vector that happens to have push and pop.</text>

  <!-- right: the two surfaces -->
  <text x="430" y="86" class="head">THE TWO SURFACES OF THE SAME OBJECT</text>
  <g filter="url(#svShadow)">
    <rect x="430" y="96" width="446" height="108" rx="11" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="452" y="122" class="card" fill="#1d4ed8">Stack's own five</text>
  <text x="452" y="146" class="m" fill="#1e3a8a">push(e) &#183; pop() &#183; peek() &#183; empty() &#183; search(o)</text>
  <text x="452" y="170" class="d">These are the operations a stack is. search() returns</text>
  <text x="452" y="186" class="d">a position counted from 1 at the top, or -1 if absent.</text>

  <g filter="url(#svShadow)">
    <rect x="430" y="216" width="446" height="152" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  </g>
  <text x="452" y="242" class="card" fill="#b91c1c">Everything else, inherited from Vector</text>
  <text x="452" y="266" class="m" fill="#7f1d1d">add(index, e) &#183; get(i) &#183; set(i, e) &#8230;</text>
  <text x="452" y="288" class="m" fill="#7f1d1d">remove(i) &#183; insertElementAt(e, i) &#183; elementAt(i)</text>
  <text x="452" y="310" class="m" fill="#7f1d1d">indexOf(o) &#183; copyInto(a) &#183; setSize(n) &#183; capacity()</text>
  <text x="452" y="334" class="d">Reach in at any index, in any order, at any time. Every</text>
  <text x="452" y="350" class="d">one of these is why &#8220;a stack&#8221; and &#8220;a list&#8221; stopped</text>
  <text x="452" y="366" class="d">being the same word.</text>

  <!-- verdict -->
  <g filter="url(#svShadow)">
    <rect x="24" y="386" width="852" height="118" rx="11" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  </g>
  <text x="44" y="412" class="card" fill="#b45309">is-a where has-a was meant</text>
  <text x="44" y="438" class="note">A Stack should have CONTAINED a list, not BEEN one:</text>
  <text x="44" y="458" class="m" fill="#78350f">class Stack&lt;E&gt; { private final List&lt;E&gt; items = new ArrayList&lt;&gt;(); &#8230; }</text>
  <text x="44" y="482" class="note">With containment there is no add(0, x), because the only methods that exist are the ones you wrote.</text>
  <text x="44" y="498" class="note">That is exactly what <tspan font-family="ui-monospace, monospace" font-weight="bold">ArrayDeque</tspan> gives you &#8212; and it is why the replacement needs no discipline from you at all.</text>
</svg>
