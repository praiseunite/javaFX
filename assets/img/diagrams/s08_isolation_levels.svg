<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <filter id="isShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .colhd { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 800; fill: #334155; }
    .lvl   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #0f172a; }
    .yes   { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #b45309; }
    .no    { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #15803d; }
    .note  { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
    .foot  { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748b; }
  </style>

  <rect width="900" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">Isolation levels and the three read phenomena</text>
  <text x="30" y="54" class="sub">Each level down the table stops one more surprise. The price is concurrency: the stricter the level, the fewer transactions run at once.</text>

  <rect x="24" y="76" width="852" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="44"  y="99" class="colhd">Isolation level</text>
  <text x="320" y="99" class="colhd">Dirty read</text>
  <text x="500" y="99" class="colhd">Non-repeatable read</text>
  <text x="712" y="99" class="colhd">Phantom read</text>

  <rect x="24" y="116" width="852" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="44"  y="148" class="lvl">READ_UNCOMMITTED</text>
  <text x="320" y="148" class="yes">possible</text>
  <text x="500" y="148" class="yes">possible</text>
  <text x="712" y="148" class="yes">possible</text>

  <rect x="24" y="172" width="852" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="44"  y="204" class="lvl">READ_COMMITTED</text>
  <text x="320" y="204" class="no">prevented</text>
  <text x="500" y="204" class="yes">possible</text>
  <text x="712" y="204" class="yes">possible</text>
  <text x="800" y="204" class="foot">H2's default</text>

  <rect x="24" y="228" width="852" height="52" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="44"  y="260" class="lvl">REPEATABLE_READ</text>
  <text x="320" y="260" class="no">prevented</text>
  <text x="500" y="260" class="no">prevented</text>
  <text x="712" y="260" class="yes">possible</text>

  <rect x="24" y="284" width="852" height="52" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="44"  y="316" class="lvl">SERIALIZABLE</text>
  <text x="320" y="316" class="no">prevented</text>
  <text x="500" y="316" class="no">prevented</text>
  <text x="712" y="316" class="no">prevented</text>

  <text x="44" y="360" class="note">Dirty read: seeing a row someone changed but has not committed.  Non-repeatable: the same row read twice gives two answers.</text>
  <text x="44" y="377" class="note">Phantom: the same query run twice returns different rows. H2 reports its own default &#8212; E02 prints the value rather than assuming it.</text>
</svg>
