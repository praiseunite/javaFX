<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <filter id="txShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="txArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .step  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #94a3b8; }
    .name  { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 800; fill: #0f172a; }
    .code  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
    .mini  { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
    .lbl   { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #64748b; }
    .note  { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
  </style>

  <rect width="900" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">The life of a transaction</text>
  <text x="30" y="54" class="sub">Several writes, one unit. Nobody else can see the middle, and a failure cannot leave it half done.</text>

  <g filter="url(#txShadow)">
    <rect x="24"  y="84" width="196" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="268" y="84" width="212" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="604" y="58"  width="272" height="94"  rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="604" y="222" width="272" height="94"  rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  </g>

  <text x="42"  y="108" class="step">1</text>
  <text x="42"  y="132" class="name">Begin</text>
  <text x="42"  y="156" class="code">setAutoCommit(false)</text>
  <text x="42"  y="178" class="mini">From here nothing is saved</text>
  <text x="42"  y="191" class="mini">until you say so.</text>

  <text x="286" y="108" class="step">2</text>
  <text x="286" y="132" class="name">Do the work</text>
  <text x="286" y="156" class="code">update &#183; insert &#183; update</text>
  <text x="286" y="178" class="mini">All of it is invisible to every</text>
  <text x="286" y="191" class="mini">other connection until you commit.</text>

  <text x="624" y="84"  class="step">3a &#183; the work finished</text>
  <text x="624" y="108" class="name">commit()</text>
  <text x="624" y="130" class="mini">Everything becomes permanent, together.</text>
  <text x="624" y="145" class="mini">A crash one second later cannot undo it.</text>

  <text x="624" y="248" class="step">3b &#183; anything threw, or you gave up</text>
  <text x="624" y="272" class="name">rollback()</text>
  <text x="624" y="294" class="mini">Everything is undone, together.</text>
  <text x="624" y="309" class="mini">As if the transaction had never run.</text>

  <line x1="220" y1="140" x2="264" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#txArrow)"/>
  <line x1="480" y1="140" x2="524" y2="140" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="524" cy="140" r="4" fill="#94a3b8"/>

  <path d="M524,140 H562 V105 H600" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#txArrow)"/>
  <path d="M524,140 H562 V269 H600" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#txArrow)"/>

  <text x="556" y="100" class="lbl" fill="#15803d" text-anchor="end">no exception</text>
  <text x="556" y="262" class="lbl" fill="#b91c1c" text-anchor="end">an exception</text>

  <rect x="24" y="344" width="852" height="40" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="44" y="369" class="note">There is no third ending. A transaction that neither commits nor rolls back holds locks and blocks everyone else &#8212; close the connection and let it roll back.</text>
</svg>
