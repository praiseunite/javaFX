<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="collGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="listGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="setGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="queueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #1e293b; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #64748b; }
    .iface-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .iface-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: rgba(255,255,255,0.85); font-style: italic; }
    .class-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
    .class-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .conn { stroke: #cbd5e1; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .conn-dashed { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="#f8fafc"/>

  <!-- Title & Legend -->
  <text x="35" y="38" class="title">Java Collections Framework Hierarchy</text>
  <text x="35" y="58" class="subtitle">Interfaces define the contract (what), while Classes provide the concrete implementation (how)</text>
  
  <g transform="translate(620, 25)">
    <rect x="0" y="0" width="110" height="24" rx="4" fill="#3b82f6" opacity="0.9"/>
    <text x="55" y="16" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">«interface»</text>
    <rect x="120" y="0" width="130" height="24" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="185" y="16" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Concrete Class</text>
  </g>

  <!-- Connectors -->
  <!-- Iterable to Collection -->
  <path d="M 330 115 L 330 140" class="conn"/>
  
  <!-- Collection to List, Set, Queue -->
  <path d="M 330 185 L 330 205 L 120 205 L 120 225" class="conn"/>
  <path d="M 330 205 L 330 225" class="conn"/>
  <path d="M 330 205 L 530 205 L 530 225" class="conn"/>

  <!-- List to implementations -->
  <path d="M 120 270 L 120 310" class="conn-dashed"/>
  
  <!-- Set to implementations -->
  <path d="M 330 270 L 330 310" class="conn-dashed"/>

  <!-- Queue to implementations -->
  <path d="M 530 270 L 530 310" class="conn-dashed"/>

  <!-- Map to implementations -->
  <path d="M 750 270 L 750 310" class="conn-dashed"/>

  <!-- ROOT INTERFACE: Iterable -->
  <g transform="translate(250, 75)" filter="url(#shadow)">
    <rect width="160" height="42" rx="8" fill="url(#rootGrad)"/>
    <text x="80" y="20" class="iface-text" text-anchor="middle">Iterable&lt;T&gt;</text>
    <text x="80" y="34" class="iface-sub" text-anchor="middle">«interface» enables for-each</text>
  </g>

  <!-- INTERFACE: Collection -->
  <g transform="translate(240, 142)" filter="url(#shadow)">
    <rect width="180" height="46" rx="8" fill="url(#collGrad)"/>
    <text x="90" y="22" class="iface-text" text-anchor="middle">Collection&lt;E&gt;</text>
    <text x="90" y="37" class="iface-sub" text-anchor="middle">«interface» root of group</text>
  </g>

  <!-- BRANCH 1: LIST -->
  <g transform="translate(40, 225)" filter="url(#shadow)">
    <rect width="160" height="46" rx="8" fill="url(#listGrad)"/>
    <text x="80" y="22" class="iface-text" text-anchor="middle">List&lt;E&gt;</text>
    <text x="80" y="37" class="iface-sub" text-anchor="middle">Ordered &amp; indexed</text>
  </g>

  <!-- List implementations -->
  <g transform="translate(35, 310)">
    <rect width="170" height="64" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="12" y="24" class="class-title">ArrayList</text>
    <text x="12" y="42" class="class-desc">Resizable array</text>
    <text x="12" y="56" class="class-desc" fill="#059669" font-weight="bold">Fast random access O(1)</text>

    <rect y="74" width="170" height="64" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="12" y="98" class="class-title">LinkedList</text>
    <text x="12" y="116" class="class-desc">Doubly-linked nodes</text>
    <text x="12" y="130" class="class-desc" fill="#059669" font-weight="bold">Fast insert/delete O(1)</text>
  </g>

  <!-- BRANCH 2: SET -->
  <g transform="translate(250, 225)" filter="url(#shadow)">
    <rect width="160" height="46" rx="8" fill="url(#setGrad)"/>
    <text x="80" y="22" class="iface-text" text-anchor="middle">Set&lt;E&gt;</text>
    <text x="80" y="37" class="iface-sub" text-anchor="middle">No duplicates</text>
  </g>

  <!-- Set implementations -->
  <g transform="translate(245, 310)">
    <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="12" y="20" class="class-title">HashSet</text>
    <text x="12" y="36" class="class-desc">Unordered &#8226; O(1) lookups</text>

    <rect y="54" width="170" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="12" y="74" class="class-title">LinkedHashSet</text>
    <text x="12" y="90" class="class-desc">Maintains insertion order</text>

    <rect y="108" width="170" height="46" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="12" y="128" class="class-title">TreeSet</text>
    <text x="12" y="144" class="class-desc">Sorted order &#8226; O(log n)</text>
  </g>

  <!-- BRANCH 3: QUEUE -->
  <g transform="translate(450, 225)" filter="url(#shadow)">
    <rect width="160" height="46" rx="8" fill="url(#queueGrad)"/>
    <text x="80" y="22" class="iface-text" text-anchor="middle">Queue&lt;E&gt; / Deque</text>
    <text x="80" y="37" class="iface-sub" text-anchor="middle">FIFO / LIFO order</text>
  </g>

  <!-- Queue implementations -->
  <g transform="translate(445, 310)">
    <rect width="170" height="64" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="12" y="24" class="class-title">ArrayDeque</text>
    <text x="12" y="42" class="class-desc">Double-ended queue</text>
    <text x="12" y="56" class="class-desc" fill="#7c3aed" font-weight="bold">Best for Stacks &amp; Queues</text>

    <rect y="74" width="170" height="64" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="12" y="98" class="class-title">PriorityQueue</text>
    <text x="12" y="116" class="class-desc">Natural or custom priority</text>
    <text x="12" y="130" class="class-desc" fill="#7c3aed" font-weight="bold">Smallest element first</text>
  </g>

  <!-- BRANCH 4: MAP (SEPARATE HIERARCHY) -->
  <g transform="translate(670, 225)" filter="url(#shadow)">
    <rect width="160" height="46" rx="8" fill="url(#mapGrad)"/>
    <text x="80" y="22" class="iface-text" text-anchor="middle">Map&lt;K, V&gt;</text>
    <text x="80" y="37" class="iface-sub" text-anchor="middle">Key &#8594; Value pairs</text>
  </g>

  <!-- Note: Map does not implement Collection -->
  <g transform="translate(670, 155)">
    <rect width="160" height="52" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="80" y="22" fill="#e11d48" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Note:</text>
    <text x="80" y="38" fill="#be123c" font-family="sans-serif" font-size="10" text-anchor="middle">Map is NOT a Collection!</text>
  </g>

  <!-- Map implementations -->
  <g transform="translate(665, 310)">
    <rect width="170" height="46" rx="8" fill="#ffffff" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <text x="12" y="20" class="class-title">HashMap</text>
    <text x="12" y="36" class="class-desc">Fast key lookup &#8226; O(1)</text>

    <rect y="54" width="170" height="46" rx="8" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="12" y="74" class="class-title">LinkedHashMap</text>
    <text x="12" y="90" class="class-desc">Preserves insertion order</text>

    <rect y="108" width="170" height="46" rx="8" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="12" y="128" class="class-title">TreeMap</text>
    <text x="12" y="144" class="class-desc">Keys kept in sorted order</text>
  </g>
</svg>
