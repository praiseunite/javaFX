<svg width="780" height="260" viewBox="0 0 780 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Box -->
  <rect x="10" y="10" width="760" height="240" rx="10" fill="var(--surface, #1e222b)" stroke="var(--border, #3a4252)" stroke-width="2"/>
  <text x="390" y="34" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="14" font-weight="700">JavaFX Application Lifecycle &#8212; Threading &amp; Execution Order</text>

  <!-- Step 1: main / launch -->
  <g transform="translate(30, 56)">
    <rect x="0" y="0" width="125" height="110" rx="8" fill="var(--surface-2, #2a303c)" stroke="var(--border, #4a5568)" stroke-width="1.5"/>
    <text x="62" y="24" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. Entry Point</text>
    <text x="62" y="44" text-anchor="middle" fill="currentColor" opacity="0.8" font-family="monospace" font-size="11">main(args)</text>
    <text x="62" y="62" text-anchor="middle" fill="var(--primary, #0ea5e9)" font-family="monospace" font-size="11">launch(args)</text>
    <line x1="10" y1="74" x2="115" y2="74" stroke="var(--border, #4a5568)" stroke-width="1"/>
    <text x="62" y="94" text-anchor="middle" fill="currentColor" opacity="0.65" font-family="system-ui, sans-serif" font-size="10">Thread: main</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 160 110 L 178 110" stroke="currentColor" opacity="0.6" stroke-width="2"/>
  <polygon points="178,106 186,110 178,114" fill="currentColor" opacity="0.6"/>

  <!-- Step 2: init() -->
  <g transform="translate(190, 56)">
    <rect x="0" y="0" width="125" height="110" rx="8" fill="var(--surface-2, #2a303c)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="62" y="24" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. Pre-load</text>
    <text x="62" y="44" text-anchor="middle" fill="currentColor" opacity="0.8" font-family="monospace" font-size="11">init()</text>
    <text x="62" y="62" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="system-ui, sans-serif" font-size="10">DB / Config Setup</text>
    <line x1="10" y1="74" x2="115" y2="74" stroke="var(--border, #4a5568)" stroke-width="1"/>
    <text x="62" y="90" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Launcher Thread</text>
    <text x="62" y="103" text-anchor="middle" fill="currentColor" opacity="0.6" font-family="system-ui, sans-serif" font-size="9">NO UI Access!</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 320 110 L 338 110" stroke="currentColor" opacity="0.6" stroke-width="2"/>
  <polygon points="338,106 346,110 338,114" fill="currentColor" opacity="0.6"/>

  <!-- Step 3: start(Stage) -->
  <g transform="translate(350, 56)">
    <rect x="0" y="0" width="140" height="110" rx="8" fill="var(--primary, #0ea5e9)" fill-opacity="0.15" stroke="var(--primary, #0ea5e9)" stroke-width="2"/>
    <text x="70" y="24" text-anchor="middle" fill="var(--primary, #0ea5e9)" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. Construct UI</text>
    <text x="70" y="44" text-anchor="middle" fill="currentColor" opacity="0.9" font-family="monospace" font-size="11">start(Stage)</text>
    <text x="70" y="62" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="system-ui, sans-serif" font-size="10">Build Scene Graph</text>
    <line x1="10" y1="74" x2="130" y2="74" stroke="var(--primary, #0ea5e9)" stroke-width="1"/>
    <text x="70" y="90" text-anchor="middle" fill="var(--primary, #0ea5e9)" font-family="system-ui, sans-serif" font-size="10" font-weight="600">JavaFX-App-Thread</text>
    <text x="70" y="103" text-anchor="middle" fill="currentColor" opacity="0.6" font-family="system-ui, sans-serif" font-size="9">stage.show() called</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 495 110 L 513 110" stroke="currentColor" opacity="0.6" stroke-width="2"/>
  <polygon points="513,106 521,110 513,114" fill="currentColor" opacity="0.6"/>

  <!-- Step 4: Event Loop -->
  <g transform="translate(525, 56)">
    <rect x="0" y="0" width="115" height="110" rx="8" fill="var(--surface-2, #2a303c)" stroke="#10b981" stroke-width="1.5"/>
    <text x="57" y="24" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. Interactive</text>
    <text x="57" y="44" text-anchor="middle" fill="currentColor" opacity="0.8" font-family="system-ui, sans-serif" font-size="11">Event Loop</text>
    <text x="57" y="62" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="system-ui, sans-serif" font-size="10">Clicks / Pulses</text>
    <line x1="8" y1="74" x2="107" y2="74" stroke="var(--border, #4a5568)" stroke-width="1"/>
    <text x="57" y="92" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="system-ui, sans-serif" font-size="10">60 FPS Render</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 645 110 L 663 110" stroke="currentColor" opacity="0.6" stroke-width="2"/>
  <polygon points="663,106 671,110 663,114" fill="currentColor" opacity="0.6"/>

  <!-- Step 5: stop() -->
  <g transform="translate(675, 56)">
    <rect x="0" y="0" width="80" height="110" rx="8" fill="var(--surface-2, #2a303c)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="40" y="24" text-anchor="middle" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">5. Clean</text>
    <text x="40" y="44" text-anchor="middle" fill="currentColor" opacity="0.8" font-family="monospace" font-size="11">stop()</text>
    <text x="40" y="62" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="system-ui, sans-serif" font-size="10">Dispose</text>
    <line x1="6" y1="74" x2="74" y2="74" stroke="var(--border, #4a5568)" stroke-width="1"/>
    <text x="40" y="92" text-anchor="middle" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10">FX Thread</text>
  </g>

  <!-- Summary banner -->
  <rect x="30" y="184" width="720" height="50" rx="6" fill="var(--surface-2, #2a303c)" stroke="var(--border, #4a5568)" stroke-width="1"/>
  <text x="390" y="205" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
    Golden Rule: Only the JavaFX Application Thread may modify nodes in an active Scene Graph!
  </text>
  <text x="390" y="222" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="monospace" font-size="11">
    Background threads must hand updates to Platform.runLater(Runnable)
  </text>
</svg>
