<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="100%" height="100%">
  <defs>
    <filter id="taShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="taArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .step  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #94a3b8; letter-spacing: .06em; }
    .name  { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 800; fill: #0f172a; }
    .code  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #334155; }
    .mini  { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
    .lbl   { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #64748b; }
    .note  { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
  </style>

  <rect width="900" height="452" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">The anatomy of one test, and the loop that keeps it honest</text>
  <text x="30" y="54" class="sub">Every test you will ever write has three parts. Two of them are preparation; only one of them can fail.</text>

  <g filter="url(#taShadow)">
    <rect x="24"  y="86"  width="268" height="164" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="316" y="86"  width="268" height="164" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="608" y="86"  width="268" height="164" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="24"  y="300" width="192" height="64"  rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="244" y="300" width="192" height="64"  rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="464" y="300" width="192" height="64"  rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="684" y="300" width="192" height="64"  rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  </g>

  <!-- 1 arrange -->
  <text x="40" y="110" class="step">1 &#183; ARRANGE</text>
  <text x="40" y="134" class="name">build the world</text>
  <text x="40" y="158" class="code">Student ada = Student.unsaved(</text>
  <text x="40" y="174" class="code">        "Ada Lovelace",</text>
  <text x="40" y="190" class="code">        "ada@example.com", 1,</text>
  <text x="40" y="206" class="code">        new BigDecimal("88.50"));</text>
  <text x="40" y="230" class="mini">Nothing here calls grade(). It only</text>
  <text x="40" y="244" class="mini">builds the student the test needs.</text>

  <!-- 2 act -->
  <text x="332" y="110" class="step">2 &#183; ACT</text>
  <text x="332" y="134" class="name">call the code once</text>
  <text x="332" y="158" class="code">String grade = ada.grade();</text>
  <text x="332" y="174" class="code">// the only line that touches</text>
  <text x="332" y="190" class="code">// the code under test</text>
  <text x="332" y="230" class="mini">One call. A test that needs three</text>
  <text x="332" y="244" class="mini">calls is usually three tests.</text>

  <!-- 3 assert -->
  <text x="624" y="110" class="step">3 &#183; ASSERT</text>
  <text x="624" y="134" class="name">say what should be true</text>
  <text x="624" y="158" class="code">assertEquals("A", grade);</text>
  <text x="624" y="174" class="code">// expected first, actual second</text>
  <text x="624" y="190" class="code">// - backwards is a classic bug</text>
  <text x="624" y="230" class="mini">The only line that can fail.</text>
  <text x="624" y="244" class="mini">Everything above it is preparation.</text>

  <text x="450" y="278" class="note" text-anchor="middle">A test with no assertion is a program that runs. It has never once told anybody that something is wrong.</text>

  <!-- the loop -->
  <text x="24" y="294" class="step">THE LOOP &#183; REPEAT FOR EVERY BEHAVIOUR</text>

  <text x="40" y="325" class="name">write the test</text>
  <text x="40" y="347" class="mini">name it after the behaviour</text>

  <text x="260" y="325" class="name">run it &#8212; RED</text>
  <text x="260" y="347" class="mini">break the code, then run it</text>

  <text x="480" y="325" class="name">make it pass</text>
  <text x="480" y="347" class="mini">fix the code, not the test</text>

  <text x="700" y="325" class="name">run it &#8212; GREEN</text>
  <text x="700" y="347" class="mini">now it is evidence, not hope</text>

  <line x1="218" y1="332" x2="240" y2="332" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#taArrow)"/>
  <line x1="438" y1="332" x2="460" y2="332" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#taArrow)"/>
  <line x1="658" y1="332" x2="680" y2="332" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#taArrow)"/>
  <path d="M770,364 V386 H110 V364" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#taArrow)"/>

  <rect x="24" y="400" width="852" height="44" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="44" y="427" class="note">The red step is the one everybody skips. A test you have never watched fail is a test you do not yet know is testing anything &#8212; which is why Session 10 breaks a store on purpose.</text>
</svg>
