<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="csgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="csgGrad2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#be123c"/></linearGradient>
    <linearGradient id="sphGrad" cx="35%" cy="35%" r="65%" fx="30%" fy="30%"><stop offset="0%" stop-color="#a78bfa"/><stop offset="50%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#3b0764"/></linearGradient>
    <linearGradient id="cylGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#34d399"/><stop offset="50%" stop-color="#059669"/><stop offset="100%" stop-color="#064e3b"/></linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>

  <rect width="820" height="380" rx="16" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">JavaFX Advanced Geometry: Shape Operations (CSG) &amp; 3D Primitives</text>

  <!-- Left Panel: 2D CSG Operations -->
  <rect x="24" y="55" width="370" height="305" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="209" y="82" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">2D Constructive Solid Geometry (CSG)</text>
  <text x="209" y="100" text-anchor="middle" fill="#94a3b8" font-size="11">Combine existing shapes dynamically using static boolean methods</text>

  <!-- Operation 1: Union -->
  <g transform="translate(45, 120)">
    <circle cx="28" cy="28" r="22" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="50" cy="28" r="22" fill="#38bdf8" fill-opacity="0.8"/>
    <text x="95" y="24" fill="#f8fafc" font-size="12" font-weight="700">Shape.union(s1, s2)</text>
    <text x="95" y="40" fill="#94a3b8" font-size="10">Merges areas into one single compound shape</text>
  </g>

  <!-- Operation 2: Intersect -->
  <g transform="translate(45, 195)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="#64748b" stroke-dasharray="3,3"/>
    <circle cx="50" cy="28" r="22" fill="none" stroke="#64748b" stroke-dasharray="3,3"/>
    <!-- Intersection path -->
    <path d="M 39 10 A 22 22 0 0 1 39 46 A 22 22 0 0 1 39 10" fill="#f43f5e"/>
    <text x="95" y="24" fill="#f8fafc" font-size="12" font-weight="700">Shape.intersect(s1, s2)</text>
    <text x="95" y="40" fill="#94a3b8" font-size="10">Retains only overlapping region between shapes</text>
  </g>

  <!-- Operation 3: Subtract -->
  <g transform="translate(45, 270)">
    <!-- Subtraction path: s1 minus s2 (crescent) -->
    <path d="M 28 6 A 22 22 0 1 0 50 28 A 22 22 0 0 1 28 6" fill="#10b981"/>
    <circle cx="50" cy="28" r="22" fill="none" stroke="#64748b" stroke-dasharray="3,3"/>
    <text x="95" y="24" fill="#f8fafc" font-size="12" font-weight="700">Shape.subtract(s1, s2)</text>
    <text x="95" y="40" fill="#94a3b8" font-size="10">Carves shape s2 out of shape s1 (cookie cutter)</text>
  </g>

  <!-- Right Panel: 3D Primitives & Phong Lighting -->
  <rect x="424" y="55" width="372" height="305" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="610" y="82" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">JavaFX 3D Primitives &amp; Shading</text>
  <text x="610" y="100" text-anchor="middle" fill="#94a3b8" font-size="11">Hardware-accelerated 3D meshes with PhongMaterial &amp; Lights</text>

  <!-- 3D Box -->
  <g transform="translate(445, 125)">
    <!-- Isometric Box illustration -->
    <!-- Top Face -->
    <polygon points="40,10 75,25 40,40 5,25" fill="#fde68a"/>
    <!-- Left Face -->
    <polygon points="5,25 40,40 40,85 5,70" fill="#f59e0b"/>
    <!-- Right Face -->
    <polygon points="40,40 75,25 75,70 40,85" fill="#d97706"/>
    <text x="95" y="35" fill="#f8fafc" font-size="12" font-weight="700">Box(width, height, depth)</text>
    <text x="95" y="52" fill="#94a3b8" font-size="10">6-sided 3D cuboid with 8 vertices</text>
    <text x="95" y="68" fill="#cbd5e1" font-size="9" font-family="monospace">new Box(100, 100, 100);</text>
  </g>

  <!-- 3D Cylinder -->
  <g transform="translate(445, 215)">
    <!-- Isometric Cylinder -->
    <path d="M 15 35 L 15 75 A 25 10 0 0 0 65 75 L 65 35 Z" fill="url(#cylGrad)"/>
    <ellipse cx="40" cy="35" rx="25" ry="10" fill="#6ee7b7"/>
    <text x="95" y="32" fill="#f8fafc" font-size="12" font-weight="700">Cylinder(radius, height)</text>
    <text x="95" y="49" fill="#94a3b8" font-size="10">Smooth circular 3D prism with caps</text>
    <text x="95" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">new Cylinder(40, 80);</text>
  </g>

  <!-- 3D Sphere -->
  <g transform="translate(445, 295)">
    <radialGradient id="sphVisual" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <circle cx="40" cy="26" r="26" fill="url(#sphVisual)"/>
    <text x="95" y="20" fill="#f8fafc" font-size="12" font-weight="700">Sphere(radius, divisions)</text>
    <text x="95" y="37" fill="#94a3b8" font-size="10">Parametric 3D sphere with smooth specular highlight</text>
    <text x="95" y="53" fill="#cbd5e1" font-size="9" font-family="monospace">new Sphere(35, 64);</text>
  </g>
</svg>
