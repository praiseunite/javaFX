<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="100%">
  <defs>
    <filter id="fsShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="fsArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .step  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #94a3b8; letter-spacing: .06em; }
    .name  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 800; fill: #0f172a; }
    .code  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #334155; }
    .mini  { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
    .tiny  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748b; }
    .lbl   { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #64748b; letter-spacing: .05em; }
  </style>

  <rect width="900" height="580" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">java.nio.file: where, what, and how</text>
  <text x="30" y="54" class="sub">Three layers. You name a Path, you ask Files to do something to it, and a FileSystem is what the path really belongs to.</text>

  <!-- ========== the three layers ========== -->
  <text x="24" y="84" class="step">1 &#183; THE THREE LAYERS</text>
  <g filter="url(#fsShadow)">
    <rect x="24" y="94"  width="852" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="146" width="852" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="198" width="852" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="44" y="122" class="name">Path</text>
  <text x="180" y="122" class="mini">Where a file is. A route, not the file &#8212; immutable, and still valid when the file is not there yet.</text>
  <text x="640" y="122" class="code">Path.of("sandbox", "all.txt")</text>
  <text x="44" y="174" class="name">Files</text>
  <text x="180" y="174" class="mini">The toolbox, all static: read, write, copy, move, compare, walk, list. If you are writing new File(...) you are in 2004.</text>
  <text x="640" y="174" class="code">Files.readAllLines(p, UTF_8)</text>
  <text x="44" y="226" class="name">FileSystem</text>
  <text x="180" y="226" class="mini">What those paths belong to. One per disk &#8212; and one per zip file, which is the trick worth remembering.</text>
  <text x="640" y="226" class="code">FileSystems.newFileSystem(zipUri)</text>

  <!-- ========== the round trip ========== -->
  <text x="24" y="276" class="step">2 &#183; THE ROUND TRIP THE REGISTRY ACTUALLY DOES</text>

  <g filter="url(#fsShadow)">
    <rect x="24"  y="288" width="148" height="90" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="212" y="288" width="176" height="90" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="428" y="288" width="176" height="90" rx="9" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="644" y="288" width="232" height="90" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <text x="40"  y="318" class="code">List&lt;Student&gt;</text>
  <text x="40"  y="336" class="mini">the objects,</text>
  <text x="40"  y="350" class="mini">in memory</text>

  <text x="228" y="318" class="code">RegistryExport</text>
  <text x="228" y="336" class="mini">one line per student,</text>
  <text x="228" y="350" class="mini">UTF-8, Files.write</text>

  <text x="444" y="318" class="code">sandbox/all.txt</text>
  <text x="444" y="336" class="mini">plus one file per student in</text>
  <text x="444" y="350" class="mini">sandbox/students/ada-lovelace.txt</text>

  <text x="660" y="318" class="code">parse(line) &#8594; Student</text>
  <text x="660" y="336" class="mini">read back, split on |,</text>
  <text x="660" y="350" class="mini">rebuild the record</text>

  <line x1="172" y1="333" x2="208" y2="333" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#fsArrow)"/>
  <line x1="388" y1="333" x2="424" y2="333" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#fsArrow)"/>
  <line x1="604" y1="333" x2="640" y2="333" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#fsArrow)"/>

  <rect x="24" y="394" width="852" height="40" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="44" y="419" class="mini" fill="#15803d">exporter.findAll().equals(back) &#8594; true &#8212; because Student is a record, and a record's equals compares the fields, not the address.</text>

  <!-- ========== the rest of the toolbox ========== -->
  <text x="24" y="466" class="step">3 &#183; THE REST OF THE TOOLBOX</text>
  <g filter="url(#fsShadow)">
    <rect x="24"  y="478" width="276" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="312" y="478" width="276" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="600" y="478" width="276" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24"  y="526" width="276" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="312" y="526" width="276" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="600" y="526" width="276" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <text x="40"  y="496" class="code">Files.walk(dir)</text>
  <text x="40"  y="511" class="tiny">every file under a folder, any depth</text>
  <text x="328" y="496" class="code">DirectoryStream</text>
  <text x="328" y="511" class="tiny">a big folder, one entry at a time</text>
  <text x="616" y="496" class="code">PathMatcher  glob:**/*.txt</text>
  <text x="616" y="511" class="tiny">match paths, not just names</text>

  <text x="40"  y="544" class="code">Files.mismatch(a, b)</text>
  <text x="40"  y="559" class="tiny">-1 if identical, else the first differing byte</text>
  <text x="328" y="544" class="code">Files.copy &#183; Files.move</text>
  <text x="328" y="559" class="tiny">with REPLACE_EXISTING when it matters</text>
  <text x="616" y="544" class="code">Files.createDirectories</text>
  <text x="616" y="559" class="tiny">and it makes the parents on the way</text>
</svg>
