<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <filter id="rbShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="rbArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .head  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #94a3b8; letter-spacing: .06em; }
    .cell  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; }
    .idx   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #94a3b8; }
    .lbl   { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 700; fill: #475569; }
    .code  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1d4ed8; }
    .note  { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
    .d     { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748b; }
  </style>

  <rect width="900" height="500" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">The ring buffer: an array with no beginning</text>
  <text x="30" y="54" class="sub">Eight slots. head is where the next element comes out, tail is where the next one goes in. When either reaches the end, it wraps.</text>
  <text x="30" y="71" class="sub">Two elements were pushed and taken out again before this trace starts, which is why head begins at slot 2 rather than slot 0.</text>

  <!-- state 1 -->
  <text x="24" y="88" class="lbl">after push(a) push(b) push(c)</text>
  <g filter="url(#rbShadow)">
    <rect x="60" y="100" width="60" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="126" y="100" width="60" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="192" y="100" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="258" y="100" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="324" y="100" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="390" y="100" width="60" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="456" y="100" width="60" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="522" y="100" width="60" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  </g>
  <g class="cell" fill="#1d4ed8" text-anchor="middle">
    <text x="222" y="126">a</text>
    <text x="288" y="126">b</text>
    <text x="354" y="126">c</text>
  </g>
  <g class="idx" text-anchor="middle">
    <text x="90"  y="156">0</text>
    <text x="156" y="156">1</text>
    <text x="222" y="156">2</text>
    <text x="288" y="156">3</text>
    <text x="354" y="156">4</text>
    <text x="420" y="156">5</text>
    <text x="486" y="156">6</text>
    <text x="552" y="156">7</text>
  </g>
  <text x="604" y="118" class="code">head = 2</text>
  <text x="604" y="136" class="code">tail = 5</text>
  <text x="604" y="154" class="d">size = 3</text>

  <!-- state 2 -->
  <text x="24" y="204" class="lbl">then push(d) &#8230; push(g) &#8212; tail ran off the end and came back</text>
  <g filter="url(#rbShadow)">
    <rect x="60" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="126" y="216" width="60" height="40" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="192" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="258" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="324" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="390" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="456" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="522" y="216" width="60" height="40" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  </g>
  <g class="cell" fill="#1d4ed8" text-anchor="middle">
    <text x="90"  y="242">g</text>
    <text x="222" y="242">a</text>
    <text x="288" y="242">b</text>
    <text x="354" y="242">c</text>
    <text x="420" y="242">d</text>
    <text x="486" y="242">e</text>
    <text x="552" y="242">f</text>
  </g>
  <g class="idx" text-anchor="middle">
    <text x="90"  y="272">0</text>
    <text x="156" y="272">1</text>
    <text x="222" y="272">2</text>
    <text x="288" y="272">3</text>
    <text x="354" y="272">4</text>
    <text x="420" y="272">5</text>
    <text x="486" y="272">6</text>
    <text x="552" y="272">7</text>
  </g>
  <text x="604" y="234" class="code">head = 2</text>
  <text x="604" y="252" class="code">tail = 1</text>
  <text x="604" y="270" class="d">size = 7</text>
  <text x="604" y="292" class="d" fill="#047857">slot 1 is still free</text>

  <!-- wrap arithmetic -->
  <text x="24" y="330" class="head">THE ONE LINE THAT MAKES IT A RING</text>
  <g filter="url(#rbShadow)">
    <rect x="24" y="340" width="852" height="52" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <text x="44" y="364" class="code">tail = (tail + 1) % data.length;</text>
  <text x="330" y="364" class="note">after slot 7, tail becomes (7 + 1) % 8 = 0 &#8212; back to the front, no copying.</text>
  <text x="44" y="384" class="d">The same expression moves head. &#8220;Full&#8221; is not head == tail; a size counter keeps the two apart.</text>

  <rect x="24" y="404" width="852" height="80" rx="11" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="44" y="428" class="note"><tspan font-weight="bold" fill="#047857">This is ArrayDeque</tspan> &#8212; the class Session 11 offered as the replacement for Stack, and Session 1 used for queues.</text>
  <text x="44" y="448" class="note">Nothing is ever shifted and nothing is ever copied, so push() and pop() cost the same whether the buffer holds</text>
  <text x="44" y="468" class="note">three elements or three million. Compare that with a Stack built on Vector, where adding at the front moves everything.</text>
</svg>
