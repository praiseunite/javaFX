<svg width="780" height="420" viewBox="0 0 780 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Window: The Stage -->
  <rect x="10" y="10" width="760" height="400" rx="10" fill="var(--surface, #1e222b)" stroke="var(--primary, #0ea5e9)" stroke-width="2.5"/>
  <rect x="10" y="10" width="760" height="34" rx="10" fill="var(--surface-2, #2a303c)"/>
  
  <!-- Window Controls -->
  <circle cx="28" cy="27" r="5" fill="#ef4444"/>
  <circle cx="44" cy="27" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="27" r="5" fill="#10b981"/>
  <text x="390" y="32" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Stage (javafx.stage.Stage) &#8212; The Top-Level Window Frame</text>

  <!-- The Scene -->
  <rect x="30" y="58" width="720" height="336" rx="8" fill="var(--surface-2, #2a303c)" stroke="var(--accent, #6366f1)" stroke-width="2" stroke-dasharray="6"/>
  <text x="50" y="82" fill="var(--accent, #6366f1)" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Scene (javafx.scene.Scene) &#8212; Physical Canvas Container (Width x Height: 800 x 600)</text>

  <!-- Scene Graph Tree: Root Node -->
  <g transform="translate(270, 102)">
    <rect x="0" y="0" width="240" height="52" rx="8" fill="var(--primary, #0ea5e9)" fill-opacity="0.2" stroke="var(--primary, #0ea5e9)" stroke-width="2"/>
    <text x="120" y="24" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Root Node (VBox / BorderPane)</text>
    <text x="120" y="42" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="monospace" font-size="11">scene.setRoot(rootNode)</text>
  </g>

  <!-- Connecting Lines from Root to Branches -->
  <path d="M 390 154 L 390 180 L 190 180 L 190 206" stroke="currentColor" opacity="0.6" stroke-width="1.8"/>
  <path d="M 390 154 L 390 180 L 590 180 L 590 206" stroke="currentColor" opacity="0.6" stroke-width="1.8"/>

  <!-- Branch Node Left: Top Bar / Header -->
  <g transform="translate(80, 206)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="var(--surface, #1e222b)" stroke="var(--border, #4a5568)" stroke-width="1.8"/>
    <text x="110" y="23" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Branch: HBox (Header Bar)</text>
    <text x="110" y="40" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="monospace" font-size="10">javafx.scene.layout.HBox</text>
  </g>

  <!-- Branch Node Right: Form Panel / Grid -->
  <g transform="translate(480, 206)">
    <rect x="0" y="0" width="220" height="50" rx="8" fill="var(--surface, #1e222b)" stroke="var(--border, #4a5568)" stroke-width="1.8"/>
    <text x="110" y="23" text-anchor="middle" fill="currentColor" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Branch: GridPane (Input Form)</text>
    <text x="110" y="40" text-anchor="middle" fill="currentColor" opacity="0.75" font-family="monospace" font-size="10">javafx.scene.layout.GridPane</text>
  </g>

  <!-- Connecting Lines from Branches to Leaves -->
  <path d="M 190 256 L 190 280 L 110 280 L 110 306" stroke="currentColor" opacity="0.5" stroke-width="1.5"/>
  <path d="M 190 256 L 190 280 L 270 280 L 270 306" stroke="currentColor" opacity="0.5" stroke-width="1.5"/>
  <path d="M 590 256 L 590 280 L 510 280 L 510 306" stroke="currentColor" opacity="0.5" stroke-width="1.5"/>
  <path d="M 590 256 L 590 280 L 670 280 L 670 306" stroke="currentColor" opacity="0.5" stroke-width="1.5"/>

  <!-- Leaf Nodes (Controls) -->
  <!-- Leaf 1: Label -->
  <g transform="translate(40, 306)">
    <rect x="0" y="0" width="140" height="46" rx="6" fill="var(--surface, #1e222b)" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Leaf: Label</text>
    <text x="70" y="37" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="monospace" font-size="10">"Student Portal"</text>
  </g>

  <!-- Leaf 2: ImageView / Logo -->
  <g transform="translate(200, 306)">
    <rect x="0" y="0" width="140" height="46" rx="6" fill="var(--surface, #1e222b)" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Leaf: ImageView</text>
    <text x="70" y="37" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="monospace" font-size="10">Logo Graphic</text>
  </g>

  <!-- Leaf 3: TextField -->
  <g transform="translate(440, 306)">
    <rect x="0" y="0" width="140" height="46" rx="6" fill="var(--surface, #1e222b)" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Leaf: TextField</text>
    <text x="70" y="37" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="monospace" font-size="10">nameInput</text>
  </g>

  <!-- Leaf 4: Button -->
  <g transform="translate(600, 306)">
    <rect x="0" y="0" width="140" height="46" rx="6" fill="var(--surface, #1e222b)" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Leaf: Button</text>
    <text x="70" y="37" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="monospace" font-size="10">"Submit Form"</text>
  </g>

  <!-- Annotation footer -->
  <text x="390" y="380" text-anchor="middle" fill="currentColor" opacity="0.7" font-family="system-ui, sans-serif" font-size="11">
    Hierarchy: Stage holds Scene &#8594; Scene holds Root Node &#8594; Root holds Branch Layouts &#8594; Layouts hold Leaf UI Controls
  </text>
</svg>
