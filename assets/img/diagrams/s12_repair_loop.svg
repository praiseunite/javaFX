<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <defs>
    <filter id="loopShadow12" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="loopGrey12" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="loopTeal12" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .box { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; }
    .tag { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; }
    .mini { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
    .note { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #0f172a; }
  </style>

  <rect width="900" height="400" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">Enterprise Diagnostic Loop: Debugging Sessions 6&#8211;10</text>
  <text x="30" y="54" class="sub">From SQL exceptions and racy transactions to decoupled seams and test assertions &#8212; work this loop.</text>

  <!-- ============================== THE FIVE STEPS ============================== -->

  <g filter="url(#loopShadow12)">
    <rect x="16" y="90" width="148" height="72" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.6"/>
    <rect x="196" y="90" width="148" height="72" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
    <rect x="376" y="90" width="148" height="72" rx="10" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.6"/>
    <rect x="556" y="90" width="148" height="72" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.6"/>
    <rect x="736" y="90" width="148" height="72" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  </g>

  <!-- 1 SPOT -->
  <circle cx="40" cy="112" r="11" fill="#ef4444"/>
  <text x="40" y="116" class="tag" fill="#ffffff" text-anchor="middle">1</text>
  <text x="58" y="117" class="box" fill="#991b1b">SPOT</text>
  <text x="30" y="140" class="mini">SQL crash, dirty read,</text>
  <text x="30" y="154" class="mini">or red JUnit check</text>

  <!-- 2 REPRODUCE -->
  <circle cx="220" cy="112" r="11" fill="#f59e0b"/>
  <text x="220" y="116" class="tag" fill="#ffffff" text-anchor="middle">2</text>
  <text x="238" y="117" class="box" fill="#b45309">REPRODUCE</text>
  <text x="210" y="140" class="mini">isolated test fixture</text>
  <text x="210" y="154" class="mini">in memory or test DB</text>

  <!-- 3 ISOLATE -->
  <circle cx="400" cy="112" r="11" fill="#0d9488"/>
  <text x="400" y="116" class="tag" fill="#ffffff" text-anchor="middle">3</text>
  <text x="418" y="117" class="box" fill="#115e59">ISOLATE</text>
  <text x="390" y="140" class="mini">SQL query, lock, seam,</text>
  <text x="390" y="154" class="mini">or assertion logic</text>

  <!-- 4 FIX -->
  <circle cx="580" cy="112" r="11" fill="#10b981"/>
  <text x="580" y="116" class="tag" fill="#ffffff" text-anchor="middle">4</text>
  <text x="598" y="117" class="box" fill="#047857">FIX</text>
  <text x="570" y="140" class="mini">bind ?, setAutoCommit,</text>
  <text x="570" y="154" class="mini">honour factory seam</text>

  <!-- 5 RE-RUN -->
  <circle cx="760" cy="112" r="11" fill="#3b82f6"/>
  <text x="760" y="116" class="tag" fill="#ffffff" text-anchor="middle">5</text>
  <text x="778" y="117" class="box" fill="#1d4ed8">RE-RUN</text>
  <text x="750" y="140" class="mini">verify atomicity &amp;</text>
  <text x="750" y="154" class="mini">full suite clean run</text>

  <!-- step arrows -->
  <path d="M 168 126 L 192 126" stroke="#0d9488" stroke-width="2.2" marker-end="url(#loopTeal12)"/>
  <path d="M 348 126 L 372 126" stroke="#0d9488" stroke-width="2.2" marker-end="url(#loopTeal12)"/>
  <path d="M 528 126 L 552 126" stroke="#0d9488" stroke-width="2.2" marker-end="url(#loopTeal12)"/>
  <path d="M 708 126 L 732 126" stroke="#0d9488" stroke-width="2.2" marker-end="url(#loopTeal12)"/>

  <!-- the loop back -->
  <path d="M 810 162 L 810 225 L 90 225 L 90 168" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#loopGrey12)"/>
  <text x="450" y="216" class="mini" fill="#64748b" text-anchor="middle">still failing or orphaned rows left behind? Go round again with fresh evidence</text>

  <!-- ============================== THE RULES ============================== -->
  <text x="30" y="272" class="note"><tspan font-weight="bold">Never test against production data.</tspan> Always use an in-memory DB or temporary file for reproducible tests.</text>
  <text x="30" y="296" class="note"><tspan font-weight="bold">Check the transaction boundaries.</tspan> An uncommitted transaction hangs; an auto-committed one leaves corrupted halves.</text>
  <text x="30" y="320" class="note"><tspan font-weight="bold">Keep the architectural seam clean.</tspan> Never allow database-specific imports (java.sql.*) to leak into presentation code.</text>
  <text x="30" y="344" class="note"><tspan font-weight="bold">Verify with repeatable tests.</tspan> Run unit tests against both in-memory and database implementations before committing.</text>
</svg>
