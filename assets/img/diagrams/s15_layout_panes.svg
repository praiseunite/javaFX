<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="hdrGrad15" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="cardGrad15" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>

  <rect width="820" height="440" rx="16" fill="#0b1120"/>
  
  <text x="410" y="32" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">JavaFX Core Layout Containers Architecture</text>

  <!-- 1. BorderPane (Top Left) -->
  <g transform="translate(30, 55)">
    <rect width="230" height="165" rx="10" fill="url(#cardGrad15)" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">BorderPane</text>
    <text x="115" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">5 Regions: Top, Bottom, Left, Right, Center</text>
    
    <!-- Mini BorderPane Wireframe -->
    <rect x="25" y="46" width="180" height="20" rx="4" fill="#0284c7" fill-opacity="0.6"/>
    <text x="115" y="60" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">TOP (Nav / Title)</text>

    <rect x="25" y="70" width="45" height="60" rx="4" fill="#6366f1" fill-opacity="0.6"/>
    <text x="47" y="104" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">LEFT</text>

    <rect x="74" y="70" width="82" height="60" rx="4" fill="#10b981" fill-opacity="0.6"/>
    <text x="115" y="104" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">CENTER (Workspace)</text>

    <rect x="160" y="70" width="45" height="60" rx="4" fill="#6366f1" fill-opacity="0.6"/>
    <text x="182" y="104" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">RIGHT</text>

    <rect x="25" y="134" width="180" height="18" rx="4" fill="#475569" fill-opacity="0.6"/>
    <text x="115" y="147" text-anchor="middle" fill="#fff" font-size="9" font-weight="600">BOTTOM (Status Bar)</text>
  </g>

  <!-- 2. GridPane (Top Middle) -->
  <g transform="translate(295, 55)">
    <rect width="230" height="165" rx="10" fill="url(#cardGrad15)" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">GridPane</text>
    <text x="115" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">2D Rows &amp; Columns with spans (hgap, vgap)</text>

    <!-- Mini 3x3 Grid Wireframe -->
    <rect x="25" y="48" width="55" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.5"/>
    <text x="52" y="66" text-anchor="middle" fill="#fff" font-size="9">(0,0)</text>

    <rect x="85" y="48" width="120" height="28" rx="4" fill="#059669" fill-opacity="0.5"/>
    <text x="145" y="66" text-anchor="middle" fill="#fff" font-size="9">colSpan=2</text>

    <rect x="25" y="82" width="55" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.5"/>
    <text x="52" y="100" text-anchor="middle" fill="#fff" font-size="9">(0,1)</text>

    <rect x="85" y="82" width="55" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.5"/>
    <text x="112" y="100" text-anchor="middle" fill="#fff" font-size="9">(1,1)</text>

    <rect x="145" y="82" width="60" height="62" rx="4" fill="#f59e0b" fill-opacity="0.5"/>
    <text x="175" y="117" text-anchor="middle" fill="#fff" font-size="9">rowSpan=2</text>

    <rect x="25" y="116" width="115" height="28" rx="4" fill="#ec4899" fill-opacity="0.5"/>
    <text x="82" y="134" text-anchor="middle" fill="#fff" font-size="9">colSpan=2 (0,2)</text>
  </g>

  <!-- 3. HBox & VBox (Top Right) -->
  <g transform="translate(560, 55)">
    <rect width="230" height="165" rx="10" fill="url(#cardGrad15)" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">HBox &amp; VBox</text>
    <text x="115" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">Linear row/column flows with spacing &amp; growth</text>

    <!-- Mini HBox -->
    <rect x="25" y="48" width="180" height="42" rx="4" fill="#334155" stroke="#475569" stroke-dasharray="2,2"/>
    <rect x="32" y="55" width="48" height="28" rx="3" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="56" y="73" text-anchor="middle" fill="#fff" font-size="9">Node 1</text>
    <rect x="86" y="55" width="48" height="28" rx="3" fill="#3b82f6" fill-opacity="0.7"/>
    <text x="110" y="73" text-anchor="middle" fill="#fff" font-size="9">Node 2</text>
    <rect x="140" y="55" width="58" height="28" rx="3" fill="#0ea5e9" fill-opacity="0.7"/>
    <text x="169" y="73" text-anchor="middle" fill="#fff" font-size="9">Hgrow</text>

    <!-- Mini VBox -->
    <rect x="25" y="98" width="180" height="52" rx="4" fill="#334155" stroke="#475569" stroke-dasharray="2,2"/>
    <rect x="32" y="103" width="166" height="20" rx="3" fill="#8b5cf6" fill-opacity="0.7"/>
    <text x="115" y="117" text-anchor="middle" fill="#fff" font-size="9">Vertical Item A</text>
    <rect x="32" y="126" width="166" height="20" rx="3" fill="#8b5cf6" fill-opacity="0.7"/>
    <text x="115" y="140" text-anchor="middle" fill="#fff" font-size="9">Vertical Item B</text>
  </g>

  <!-- 4. StackPane (Bottom Left) -->
  <g transform="translate(30, 245)">
    <rect width="230" height="170" rx="10" fill="url(#cardGrad15)" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">StackPane</text>
    <text x="115" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">Z-ordering: Overlapping child layers</text>

    <!-- Isometric stacked layer cards -->
    <rect x="35" y="90" width="130" height="60" rx="6" fill="#334155" stroke="#64748b"/>
    <text x="75" y="142" fill="#94a3b8" font-size="9">Layer 1 (Background Canvas)</text>

    <rect x="55" y="70" width="130" height="60" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="95" y="122" fill="#bfdbfe" font-size="9">Layer 2 (Graphic Shape)</text>

    <rect x="75" y="50" width="130" height="60" rx="6" fill="#065f46" stroke="#10b981"/>
    <text x="115" y="85" fill="#a7f3d0" font-size="9" font-weight="700">Layer 3 (Text Label)</text>
  </g>

  <!-- 5. FlowPane & TilePane (Bottom Middle) -->
  <g transform="translate(295, 245)">
    <rect width="230" height="170" rx="10" fill="url(#cardGrad15)" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">FlowPane &amp; TilePane</text>
    <text x="115" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">Wrapping flows &amp; uniform grid tiles</text>

    <!-- Mini wrapping chips -->
    <rect x="25" y="50" width="55" height="24" rx="12" fill="#ec4899" fill-opacity="0.6"/>
    <text x="52" y="66" text-anchor="middle" fill="#fff" font-size="9">JavaFX</text>
    <rect x="85" y="50" width="65" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.6"/>
    <text x="117" y="66" text-anchor="middle" fill="#fff" font-size="9">CSS Skins</text>
    <rect x="155" y="50" width="50" height="24" rx="12" fill="#3b82f6" fill-opacity="0.6"/>
    <text x="180" y="66" text-anchor="middle" fill="#fff" font-size="9">Charts</text>

    <rect x="25" y="80" width="70" height="24" rx="12" fill="#10b981" fill-opacity="0.6"/>
    <text x="60" y="96" text-anchor="middle" fill="#fff" font-size="9">BorderPane</text>
    <rect x="100" y="80" width="60" height="24" rx="12" fill="#f59e0b" fill-opacity="0.6"/>
    <text x="130" y="96" text-anchor="middle" fill="#fff" font-size="9">GridPane</text>
    
    <text x="115" y="130" text-anchor="middle" fill="#cbd5e1" font-size="9">Wraps to next row when boundary is reached</text>
    <text x="115" y="146" text-anchor="middle" fill="#64748b" font-size="8">TilePane: forces identical uniform cell sizes</text>
  </g>

  <!-- 6. AnchorPane & SplitPane (Bottom Right) -->
  <g transform="translate(560, 245)">
    <rect width="230" height="170" rx="10" fill="url(#cardGrad15)" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="22" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">AnchorPane &amp; SplitPane</text>
    <text x="115" y="36" text-anchor="middle" fill="#94a3b8" font-size="10">Edge docking pins &amp; draggable dividers</text>

    <!-- Mini AnchorPane wireframe -->
    <rect x="25" y="50" width="180" height="98" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    
    <!-- Pinned button in bottom-right -->
    <line x1="160" y1="120" x2="195" y2="120" stroke="#f43f5e" stroke-dasharray="2,2"/>
    <line x1="178" y1="128" x2="178" y2="148" stroke="#f43f5e" stroke-dasharray="2,2"/>
    <rect x="135" y="112" width="60" height="24" rx="4" fill="#f43f5e"/>
    <text x="165" y="128" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">Pinned</text>

    <!-- Draggable Divider in SplitPane -->
    <line x1="95" y1="50" x2="95" y2="148" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="95" cy="99" r="4" fill="#38bdf8"/>
    <text x="58" y="99" text-anchor="middle" fill="#94a3b8" font-size="8">Left Pane</text>
    <text x="140" y="75" text-anchor="middle" fill="#94a3b8" font-size="8">Right Pane</text>
  </g>
</svg>
