<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="hdr14" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="leaf14" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="abs14" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
  </defs>
  <rect width="820" height="420" rx="16" fill="#0f172a"/>
  <text x="410" y="32" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">JavaFX 2D Shape Class Hierarchy</text>

  <!-- Node (top) -->
  <rect x="330" y="50" width="160" height="36" rx="8" fill="url(#hdr14)"/>
  <text x="410" y="73" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">javafx.scene.Node</text>

  <!-- Shape (abstract) -->
  <line x1="410" y1="86" x2="410" y2="110" stroke="#475569" stroke-width="2"/>
  <rect x="310" y="110" width="200" height="36" rx="8" fill="url(#abs14)"/>
  <text x="410" y="133" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">Shape (abstract)</text>
  <text x="410" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">fill, stroke, strokeWidth, smooth</text>

  <!-- Branches -->
  <line x1="410" y1="146" x2="410" y2="180" stroke="#475569" stroke-width="2"/>
  <!-- Horizontal spread line -->
  <line x1="80" y1="180" x2="740" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Vertical drops to each shape -->
  <line x1="80" y1="180" x2="80" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="190" y1="180" x2="190" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="180" x2="300" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="180" x2="410" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="180" x2="520" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="630" y1="180" x2="630" y2="210" stroke="#475569" stroke-width="2"/>
  <line x1="740" y1="180" x2="740" y2="210" stroke="#475569" stroke-width="2"/>

  <!-- Line shape -->
  <rect x="20" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="80" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Line</text>
  <text x="80" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">startX,startY</text>
  <text x="80" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">endX,endY</text>

  <!-- Rectangle -->
  <rect x="130" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="190" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Rectangle</text>
  <text x="190" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">width,height</text>
  <text x="190" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">arcWidth,arcHeight</text>

  <!-- Circle -->
  <rect x="240" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="300" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Circle</text>
  <text x="300" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">centerX,centerY</text>
  <text x="300" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">radius</text>

  <!-- Ellipse -->
  <rect x="350" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="410" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Ellipse</text>
  <text x="410" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">radiusX,radiusY</text>
  <text x="410" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">centerX,centerY</text>

  <!-- Arc -->
  <rect x="460" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="520" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Arc</text>
  <text x="520" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">startAngle,length</text>
  <text x="520" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">ArcType enum</text>

  <!-- Polygon -->
  <rect x="570" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="630" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Polygon</text>
  <text x="630" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">getPoints()</text>
  <text x="630" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">x1,y1,x2,y2...</text>

  <!-- Polyline -->
  <rect x="680" y="210" width="120" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="740" y="233" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Polyline</text>
  <text x="740" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9">Open polygon</text>
  <text x="740" y="274" text-anchor="middle" fill="#cbd5e1" font-size="9">no auto-close</text>

  <!-- Second row: more shapes -->
  <line x1="410" y1="146" x2="410" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Text class (special) -->
  <rect x="130" y="310" width="160" height="36" rx="8" fill="#10b981"/>
  <text x="210" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Text (extends Shape)</text>
  <text x="210" y="360" text-anchor="middle" fill="#a7f3d0" font-size="9">text, font, wrappingWidth</text>
  <text x="210" y="372" text-anchor="middle" fill="#a7f3d0" font-size="9">textAlignment, textOrigin</text>
  <line x1="210" y1="146" x2="210" y2="180" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <line x1="210" y1="280" x2="210" y2="310" stroke="#475569" stroke-width="2"/>

  <!-- SVGPath -->
  <rect x="350" y="310" width="160" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="430" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">SVGPath</text>
  <text x="430" y="360" text-anchor="middle" fill="#cbd5e1" font-size="9">content (SVG path data)</text>
  <line x1="430" y1="280" x2="430" y2="310" stroke="#475569" stroke-width="2"/>

  <!-- CubicCurve -->
  <rect x="560" y="310" width="160" height="36" rx="8" fill="url(#leaf14)"/>
  <text x="640" y="333" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">CubicCurve</text>
  <text x="640" y="360" text-anchor="middle" fill="#cbd5e1" font-size="9">control points</text>
  <line x1="640" y1="280" x2="640" y2="310" stroke="#475569" stroke-width="2"/>

  <!-- Legend -->
  <rect x="20" y="385" width="14" height="14" rx="3" fill="url(#hdr14)"/>
  <text x="40" y="397" fill="#94a3b8" font-size="10">Base / Parent</text>
  <rect x="130" y="385" width="14" height="14" rx="3" fill="url(#abs14)"/>
  <text x="150" y="397" fill="#94a3b8" font-size="10">Abstract</text>
  <rect x="220" y="385" width="14" height="14" rx="3" fill="url(#leaf14)"/>
  <text x="240" y="397" fill="#94a3b8" font-size="10">Concrete Shape</text>
  <rect x="350" y="385" width="14" height="14" rx="3" fill="#10b981"/>
  <text x="370" y="397" fill="#94a3b8" font-size="10">Text Node</text>
</svg>
