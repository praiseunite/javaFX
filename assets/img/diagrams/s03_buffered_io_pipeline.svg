<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <filter id="pipeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="pipeArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .node-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; }
    .code { font-family: ui-monospace, monospace; font-size: 11.5px; }
  </style>

  <rect width="880" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">How Buffering Eliminates Costly Disk I/O Operations</text>
  <text x="30" y="54" class="sub">Every trip to the disk is slow compared with memory. A buffer fetches 8,192 bytes per trip, so your loop mostly reads from memory.</text>

  <!-- STAGE 1: HARD DISK / SSD -->
  <g transform="translate(30, 85)" filter="url(#pipeShadow)">
    <rect width="180" height="180" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="34" rx="8" fill="#f1f5f9"/>
    <text x="90" y="22" class="node-title" text-anchor="middle">&#128190; Physical Storage</text>

    <g transform="translate(15, 50)">
      <circle cx="75" cy="40" r="32" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="75" cy="40" r="10" fill="#cbd5e1"/>
      <line x1="75" y1="40" x2="95" y2="25" stroke="#ef4444" stroke-width="2"/>
      <text x="75" y="95" class="code" fill="#b91c1c" font-weight="bold" text-anchor="middle">Slow: each trip costs time</text>
      <text x="75" y="112" class="node-desc" text-anchor="middle">Physical platter / Flash bus</text>
    </g>
  </g>

  <!-- ARROW 1 -> 2: 1 BIG CHUNK -->
  <path d="M 220 175 L 285 175" stroke="#3b82f6" stroke-width="3" marker-end="url(#pipeArr)"/>
  <text x="252" y="155" class="code" fill="#2563eb" font-weight="bold" text-anchor="middle">1 big read</text>
  <text x="252" y="168" class="node-desc" fill="#3b82f6" text-anchor="middle">(8,192 bytes)</text>

  <!-- STAGE 2: BUFFERED INPUT STREAM (RAM BUCKET) -->
  <g transform="translate(295, 85)" filter="url(#pipeShadow)">
    <rect width="250" height="180" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="34" rx="8" fill="#d1fae5"/>
    <text x="125" y="22" class="node-title" fill="#047857" text-anchor="middle">&#129683; BufferedInputStream (RAM)</text>

    <g transform="translate(15, 48)">
      <rect width="220" height="50" rx="4" fill="#ffffff" stroke="#6ee7b7"/>
      <!-- Filled buffer blocks -->
      <g transform="translate(5, 5)">
        <rect width="24" height="40" rx="2" fill="#a7f3d0"/>
        <rect x="27" width="24" height="40" rx="2" fill="#a7f3d0"/>
        <rect x="54" width="24" height="40" rx="2" fill="#a7f3d0"/>
        <rect x="81" width="24" height="40" rx="2" fill="#a7f3d0"/>
        <rect x="108" width="24" height="40" rx="2" fill="#a7f3d0"/>
        <rect x="135" width="24" height="40" rx="2" fill="#a7f3d0"/>
        <text x="180" y="25" class="code" fill="#047857" font-weight="bold">8 KB</text>
      </g>
      <text x="110" y="75" class="code" fill="#047857" font-weight="bold" text-anchor="middle">Fast: already in memory</text>
      <text x="110" y="95" class="node-desc" text-anchor="middle">Holds next 8,192 bytes in memory cache</text>
      <text x="110" y="112" class="node-desc" fill="#059669" text-anchor="middle">&#10003; Only re-fills from disk when empty!</text>
    </g>
  </g>

  <!-- ARROW 2 -> 3: MICRO READING -->
  <path d="M 555 175 L 620 175" stroke="#10b981" stroke-width="3" marker-end="url(#pipeArr)"/>
  <text x="587" y="155" class="code" fill="#047857" font-weight="bold" text-anchor="middle">read()</text>
  <text x="587" y="168" class="node-desc" fill="#059669" text-anchor="middle">instant</text>

  <!-- STAGE 3: APPLICATION CODE -->
  <g transform="translate(630, 85)" filter="url(#pipeShadow)">
    <rect width="220" height="180" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#eef2ff"/>
    <text x="110" y="22" class="node-title" fill="#4338ca" text-anchor="middle">&#128187; Your Java Code</text>

    <g transform="translate(15, 50)">
      <rect width="190" height="60" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="10" y="20" class="code" fill="#1e1b4b">int b;</text>
      <text x="10" y="38" class="code" fill="#4338ca" font-weight="bold">while ((b = in.read()) != -1) {</text>
      <text x="25" y="54" class="code" fill="#312e81">process(b);</text>
      <text x="10" y="70" class="code" fill="#4338ca">}</text>

      <text x="95" y="95" class="code" fill="#4338ca" font-weight="bold" text-anchor="middle">Same loop, far fewer trips</text>
      <text x="95" y="112" class="node-desc" text-anchor="middle">Your code does not change</text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(30, 290)">
    <rect width="820" height="35" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="15" y="22" class="node-desc">&#127937; <tspan font-weight="bold" fill="#0f172a">Performance Takeaway:</tspan> 10 MB read one byte at a time: 10,000,001 trips unbuffered vs 1,222 trips buffered (see Example 4).</text>
  </g>
</svg>
