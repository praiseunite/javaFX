<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <filter id="aiShadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.10"/>
    </filter>
    <marker id="aiArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .sub   { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #64748b; }
    .step  { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 800; fill: #94a3b8; letter-spacing: .06em; }
    .name  { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; }
    .mini  { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #475569; }
    .lbl   { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; font-weight: 700; fill: #64748b; }
    .note  { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #334155; }
  </style>

  <rect width="900" height="440" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="30" y="34" class="title">Generating tests with an assistant: four steps, and the third one is yours</text>
  <text x="30" y="54" class="sub">The assistant writes a draft. You decide what is true. Nothing gets kept because it was green.</text>

  <g filter="url(#aiShadow)">
    <rect x="24"  y="110" width="192" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="244" y="110" width="192" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="464" y="110" width="192" height="110" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="684" y="110" width="192" height="110" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>

    <rect x="24"  y="252" width="192" height="68" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="244" y="252" width="192" height="68" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="464" y="252" width="192" height="68" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="684" y="252" width="192" height="68" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  </g>

  <!-- 1 prompt -->
  <text x="40" y="134" class="step">1 &#183; PROMPT</text>
  <text x="40" y="158" class="name">say what, not how</text>
  <text x="40" y="180" class="mini">name the interface,</text>
  <text x="40" y="194" class="mini">the behaviours, and</text>
  <text x="40" y="208" class="mini">what must not change</text>

  <!-- 2 generate -->
  <text x="260" y="134" class="step">2 &#183; GENERATE</text>
  <text x="260" y="158" class="name">read every line</text>
  <text x="260" y="180" class="mini">fast, confident, and</text>
  <text x="260" y="194" class="mini">it has never run</text>
  <text x="260" y="208" class="mini">your code</text>

  <!-- 3 critique -->
  <text x="480" y="134" class="step">3 &#183; CRITIQUE &#183; YOURS</text>
  <text x="480" y="158" class="name">ask one question</text>
  <text x="480" y="180" class="mini">if I broke the code,</text>
  <text x="480" y="194" class="mini">would this go red?</text>

  <!-- 4 decide -->
  <text x="700" y="134" class="step">4 &#183; DECIDE</text>
  <text x="700" y="158" class="name">keep or reject</text>
  <text x="700" y="180" class="mini">kept with a reason.</text>
  <text x="700" y="194" class="mini">rejected with one.</text>
  <text x="700" y="208" class="mini">never kept by default</text>

  <line x1="218" y1="165" x2="240" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aiArrow)"/>
  <line x1="438" y1="165" x2="460" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aiArrow)"/>
  <line x1="658" y1="165" x2="680" y2="165" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aiArrow)"/>

  <path d="M780,110 V92 H340 V110" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#aiArrow)"/>
  <text x="560" y="84" class="lbl" text-anchor="middle">reject &#8594; sharpen the prompt and ask again</text>

  <text x="24" y="242" class="step">WHAT THE CRITIQUE FINDS IN GENERATED TESTS</text>

  <text x="40" y="282" class="name">asserts nothing</text>
  <text x="40" y="302" class="mini">a call is not a test</text>

  <text x="260" y="282" class="name">assertEquals(x, x)</text>
  <text x="260" y="302" class="mini">true whatever x is</text>

  <text x="480" y="282" class="name">swallows failure</text>
  <text x="480" y="302" class="mini">an empty catch block</text>

  <text x="700" y="282" class="name">asserts the setup</text>
  <text x="700" y="302" class="mini">checks its own data</text>

  <rect x="24" y="336" width="852" height="84" rx="9" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="44" y="362" class="note">The rule that decides everything: you must be able to explain every line you keep, and say why you threw the rest away.</text>
  <text x="44" y="380" class="note">An assistant never saw your requirements and cannot run your program, so it will happily assert what the code does rather than what it should.</text>
  <text x="44" y="398" class="note">Kept code you cannot defend is worse than no code, because it looks like evidence. The mark is on the critique, not on the tool.</text>
</svg>
