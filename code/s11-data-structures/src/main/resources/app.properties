# Session 11 — a plain configuration file, read with java.util.Properties.
#
# Properties is the one class from the Dictionary family that is still the right tool today:
# it loads a file like this one and hands back Strings by key. Every framework you will meet
# reads its configuration this way, because this is the format that got there first.
#
# Keep this file ASCII. Properties.load(InputStream) reads ISO-8859-1 by specification, so an
# accented character typed here would arrive mangled — see the page's Common Mistakes.
app.name=Registry
app.version=11.0
stock.currency=NGN
stock.lowThreshold=5
