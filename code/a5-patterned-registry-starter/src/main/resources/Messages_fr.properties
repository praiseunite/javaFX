#  is not here.
#
#  Rules:
#    - The KEY on the left never changes. Only the text on the right is French.
#    - Keep the {0}, {1} holes, and keep them in a sensible order for French.
#    - A literal apostrophe is written twice:  Tapez ''aide''
#    - Save the file as UTF-8 and type the accents: étudiant, enregistrés.
#      Java 9+ reads .properties as UTF-8, so no é escapes are needed.
#
#  This file must be UTF-8. If your editor writes it as ISO-8859-1 the accented
#  letters arrive as two strange characters each, and the self-check says so.
# ============================================================================

