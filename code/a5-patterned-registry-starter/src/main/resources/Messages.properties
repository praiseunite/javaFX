# ============================================================================
#  Messages.properties — the base bundle. GIVEN. Do not rename it.
#
#  This file is REQUIRED, and it is the one every other Messages_*.properties
#  inherits from. That is why a key a translator has not reached yet shows
#  English instead of an error or a blank.
#
#  Do NOT rename it to Messages_en.properties. The JVM looks for the base name
#  first; a file called Messages_en.properties on its own is not found for every
#  locale, and the fallback disappears.
#
#  {0}, {1}, ... are MessageFormat holes. Write a literal apostrophe as ''.
#  Java 9+ reads this file as UTF-8, so an accent needs no \uXXXX escape.
# ============================================================================

app.title = Student Registry
app.subtitle = Aptech - Building Rich Java Applications

students.count = {0} students on file
students.none = No students to show.

enrolment.done = {0} enrolled on {1,date,long} - total fee {2,number,currency}
enrolment.instalments = Payable in {0} instalments of {1,number,currency}

menu.help = Type ''help'' for options
menu.quit = Type ''quit'' to leave
